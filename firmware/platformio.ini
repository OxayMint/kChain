; ESP32-C3 Super Mini. PlatformIO has no board id for that module, so this
; uses the generic ESP32-C3 DevKitM-1 target (same chip, 4 MB flash) and
; turns on the native USB Serial/JTAG port. GPIO 20 and 21 stay unused.
;
; Experimental USB-only build. The firmware does not start Bluetooth or Wi-Fi.
; btInUse() returns false, so the Arduino core releases the Bluetooth
; controller at boot. Typing goes through the USB cable only.
;
; Build:  pio run
; Flash:  pio run -t upload
; Logs:   pio device monitor

[env:esp32-c3-super-mini]
platform = espressif32@6.8.1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.partitions = partitions.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@7.2.1
