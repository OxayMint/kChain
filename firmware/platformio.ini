; ESP32-S3. PlatformIO has no id for this header (pins 1-13, GND, 5V, 3V,
; RX, TX), so this uses the generic ESP32-S3 DevKitC-1 target. The part on
; this header is the 4 MB ESP32-S3FH4. An 8 MB image does not boot on it.
; A larger module still accepts a 4 MB image. No PSRAM.
; USB serial is the native port. The board already defines
; ARDUINO_USB_MODE=1 (hardware CDC). CDC on boot makes Serial that port.
; RX and TX stay unused.
;
; Experimental USB-only build. The firmware does not start Bluetooth or Wi-Fi.
; btInUse() returns false, so the Arduino core releases the Bluetooth
; controller at boot. Typing goes through the USB cable only.
;
; Build:  pio run
; Flash:  pio run -t upload
; Logs:   pio device monitor

[env:esp32-s3]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@7.2.1
